name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Lo que no necesita QGIS. Rápido, así que va primero.
  # ---------------------------------------------------------------------
  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 es lo que trae QGIS 3.28 LTR, la versión mínima que declara
        # metadata.txt; 3.12 es la de QGIS actual. Si el código usa algo de
        # 3.10+ (match, union con |) falla aquí y no en la máquina del usuario.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # Hay que indicarlo: el patron por omision de
          # setup-python para pip no cubre un archivo que no se
          # llame requirements.txt, y la accion FALLA cuando no
          # encuentra ninguno en vez de seguir sin cache.
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt

      - name: Pruebas que no necesitan QGIS
        shell: bash
        run: |
          set +e
          python -m pytest tests -v --tb=short > /tmp/pytest.txt 2>&1
          codigo=$?
          cat /tmp/pytest.txt
          if [ "${codigo:-1}" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)|^E ' /tmp/pytest.txt | head -10 \
              | sed 's/^/::error::/'
            echo "::error::pytest salio con codigo ${codigo:-?}"
          fi
          exit "${codigo:-1}"

      - name: Comprobaciones previas al portal
        # --sin-red porque el corredor no debe depender de que GitHub
        # responda para dar por buena una rama.
        run: python tools/preflight.py --sin-red --sin-color

  # ---------------------------------------------------------------------
  # Estilo y seguridad. Bandit es el que bloquea en plugins.qgis.org.
  # ---------------------------------------------------------------------
  estilo:
    name: Estilo y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Hay que indicarlo: el patron por omision de
          # setup-python para pip no cubre un archivo que no se
          # llame requirements.txt, y la accion FALLA cuando no
          # encuentra ninguno en vez de seguir sin cache.
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt

      - name: flake8
        run: python -m flake8 --max-line-length=100 BuscadorSTAC tools tests

      - name: bandit (todas las severidades)
        # Sin -ll a propósito: el portal reporta también los de severidad
        # baja, y un try/except/pass (B110) ha bloqueado versiones.
        run: python -m bandit -q -r BuscadorSTAC

      - name: Cero «except:» desnudos
        run: |
          if grep -rnE '^\s*except\s*:' BuscadorSTAC --include='*.py'; then
            echo "::error::hay except desnudos"; exit 1
          fi

      - name: Todo «# nosec» lleva su código B###
        # Un «# nosec» a secas silencia cualquier hallazgo futuro en esa
        # línea, incluido uno que nadie revisó.
        run: |
          if grep -rn 'nosec' BuscadorSTAC --include='*.py' \
             | grep -vE 'nosec[[:space:]]+B[0-9]{3}'; then
            echo "::error::hay un nosec sin código"; exit 1
          fi

  # ---------------------------------------------------------------------
  # QGIS de verdad, en las imágenes oficiales. Es lo único que responde
  # «¿sigue existiendo esta API?» y «¿carga el complemento?».
  # ---------------------------------------------------------------------
  qgis:
    name: QGIS ${{ matrix.etiqueta }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # La más antigua que declara metadata.txt. Fijada, porque el
          # sentido de esta entrada es justamente que no se mueva.
          - imagen: qgis/qgis:release-3_28
            etiqueta: "3.28 (mínima declarada)"
          # Etiquetas de canal, que SÍ se mueven: avisan cuando una QGIS
          # nueva rompe el complemento.
          - imagen: qgis/qgis:ltr
            etiqueta: "LTR actual"
          - imagen: qgis/qgis:stable
            etiqueta: "estable actual"
          # Sigue a master: se rompe aquí antes de romperse para el usuario.
          # Se permite que falle porque master puede estar roto por su cuenta.
          - imagen: qgis/qgis:latest
            etiqueta: "master"
            tolerante: true
    continue-on-error: ${{ matrix.tolerante == true }}
    container:
      image: ${{ matrix.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: |
          python3 -c "from qgis.core import Qgis; print('QGIS', Qgis.QGIS_VERSION)"
          python3 -c "from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; print('Qt', QT_VERSION_STR, 'PyQt', PYQT_VERSION_STR)"
          python3 -c "from osgeo import gdal; print('GDAL', gdal.VersionInfo('RELEASE_NAME'))"
          python3 --version

      - name: Auditar cada símbolo de QGIS, Qt y GDAL que usa el complemento
        # Caza una API retirada o un enum que se movió, que es la forma
        # habitual en que un complemento se rompe al cambiar de versión.
        # El fallo es silencioso dentro de un post-procesador: la capa se
        # carga sin estilo y solo se ve leyendo el registro completo.
        #
        # La salida se repite como anotaciones de GitHub a proposito: el
        # registro de un trabajo se sirve desde almacenamiento externo y no
        # siempre se puede leer con la API, mientras que las anotaciones si.
        # Sin esto, «exit code 1» es todo lo que queda de un diagnostico que
        # SI dice que simbolo falta.
        shell: bash
        run: |
          set +e
          python3 tools/api_audit.py > /tmp/audit.txt 2>&1
          codigo=$?
          cat /tmp/audit.txt
          if [ "${codigo:-1}" -ne 0 ]; then
            grep -iE 'falta|error' /tmp/audit.txt | head -8 \
              | sed 's/^/::error::/'
            echo "::error::api_audit.py salio con codigo ${codigo:-?}"
          fi
          exit "${codigo:-1}"

      - name: Importar el complemento y registrar sus algoritmos
        # xvfb da un display a los widgets. Sin él, instanciar cualquier
        # cosa de Qt aborta.
        run: xvfb-run -a python3 tools/smoke_test.py

  # ---------------------------------------------------------------------
  # El ZIP, como artefacto descargable de cada ejecución.
  # ---------------------------------------------------------------------
  paquete:
    name: Construir el ZIP
    runs-on: ubuntu-latest
    needs: [pruebas, estilo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Hay que indicarlo: el patron por omision de
          # setup-python para pip no cubre un archivo que no se
          # llame requirements.txt, y la accion FALLA cuando no
          # encuentra ninguno en vez de seguir sin cache.
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/preflight.py --sin-red --sin-color
      - uses: actions/upload-artifact@v4
        with:
          name: complemento-zip
          path: dist/*.zip
          if-no-files-found: error
