# Configuración de flake8 para este complemento.
#
# 100 columnas en vez de las 79 por omisión: es lo habitual en el ecosistema
# QGIS y lo que el código ya respeta. Con el valor por omisión, flake8 reporta
# ~164 E501, todos dentro de cadenas de ayuda en español que no se pueden
# partir sin empeorar la legibilidad. El informe de flake8 del portal de
# complementos es informativo y no bloquea la aprobación; el que sí bloquea es
# Bandit, que este complemento pasa sin hallazgos.
[flake8]
max-line-length = 100
exclude = .git,__pycache__,i18n
# W503/W504 son mutuamente contradictorios: flake8 ignora W503 por omisión y
# se mantiene así para no entrar en el ciclo de correcciones alternas.
extend-ignore = W503
